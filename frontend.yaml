apiVersion: apps/v1
kind: Deployment
metadata:
  name: pharma-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pharma-frontend
  template:
    metadata:
      labels:
        app: pharma-frontend
    spec:
      containers:
      - name: frontend
        image: your-docker-repo/pharma-frontend:v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: pharma-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80